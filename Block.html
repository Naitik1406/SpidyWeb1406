<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Block vs Inline - Demo</title>
  <style>
    :root{
      --blue-outer:#2f76d6;
      --blue-inner:#e8f4ff;
      --gold-outer:#f4c66a;
      --gold-inner:#fff3db;
      --bg:#fbfcfe;
      --text:#123049;
    }

    html,body{height:100%;margin:0;font-family:Inter, system-ui, Arial, sans-serif;background:var(--bg);color:var(--text)}
    .page{
      max-width:1100px;margin:32px auto;padding:24px;
      display:flex;flex-direction:column;gap:28px;align-items:center;
    }

    h1{
      margin:0;font-size:28px;color:#1b4bd6;font-weight:700;
      text-align:center;
    }

    .demo{
      width:100%;
      display:flex;gap:80px;align-items:flex-start;justify-content:center;
      padding:20px 10px;
    }

    /* LEFT: block-level column */
    .panel{
      display:flex;flex-direction:column;align-items:center;
      gap:14px;
    }

    .block-wrapper{
      width:260px;
      padding:18px;
      border-radius:14px;
      border:6px solid var(--blue-outer);
      box-sizing:border-box;
      background:transparent;
    }

    .stack{
      display:flex;flex-direction:column;gap:18px;
    }

    .stack .item{
      background:var(--blue-inner);
      border:2px solid rgba(47,118,214,0.25);
      border-radius:10px;
      padding:18px 16px;
      text-align:center;
      font-weight:600;
      color:var(--text);
      box-shadow:0 6px 18px rgba(47,118,214,0.06);
    }

    .caption{font-size:16px;color:#333;margin-top:6px;}

    /* RIGHT: inline row */
    .inline-wrapper{
      width:620px;
      padding:18px;
      border-radius:10px;
      border:4px solid var(--gold-outer);
      box-sizing:border-box;
      background:transparent;
      display:flex;flex-direction:column;align-items:center;
      gap:18px;
    }

    .inline-row{
      width:100%;
      display:flex;gap:26px;justify-content:center;align-items:center;padding:12px 8px;
    }

    .inline-box{
      background:var(--gold-inner);
      border:2px solid rgba(244,198,106,0.6);
      border-radius:10px;
      padding:18px 26px;
      min-width:88px;
      text-align:center;
      font-weight:600;
      box-shadow:0 8px 20px rgba(244,198,106,0.06);
    }

    /* responsive */
    @media (max-width:900px){
      .demo{flex-direction:column;gap:26px;padding:8px}
      .inline-wrapper{width:92%}
      .block-wrapper{width:85%}
    }
  </style>
</head>
<body>
  <div class="page">
    <h1>Major Versions of HTML</h1>

    <div class="demo">
      <div class="panel">
        <div class="block-wrapper">
          <div class="stack">
            <div class="item">Box 1</div>
            <div class="item">Box 2</div>
            <div class="item">Box 3</div>
            <div class="item">Box 4</div>
          </div>
        </div>
        <div class="caption">Block-Level Element</div>
      </div>

      <div class="panel">
        <div class="inline-wrapper">
          <div class="inline-row">
            <div class="inline-box">Box 1</div>
            <div class="inline-box">Box 2</div>
            <div class="inline-box">Box 3</div>
            <div class="inline-box">Box 4</div>
          </div>
        </div>
        <div class="caption">Inline Element</div>
      </div>
    </div>
  </div>
</body>
</html>
